name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only a pull request cancels its superseded run; every main push keeps its own
# run because the release gate looks up the run for the exact released commit.
# A main push gets its own group (run_id): a shared group would still drop a
# pending run when a newer push queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test extras
        run: python3 -m pip install Pygments

      - name: Lint templates and check token sync
        run: python3 skills/kami/scripts/build.py --check

      - name: Check generated Codex plugin metadata
        run: python3 scripts/build_metadata.py --check

      - name: Build and audit skill package
        run: bash scripts/package-skill.sh /tmp/kami-ci.zip

  verify-render:
    name: render and verify
    # No needs: lint takes about 15s and render reads none of its output, so
    # waiting for it only delayed the long job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install WeasyPrint system libs and CJK fallback fonts
        # libcairo2 / libpango / libharfbuzz are required by WeasyPrint at
        # runtime; fonts-noto-cjk provides a serif CJK fallback so the Chinese
        # templates render with embedded glyphs even though TsangerJinKai02 is
        # commercial and not shipped in CI. The verify step accepts Noto as a
        # recognized fallback (see skills/kami/scripts/verify.py fallback_present).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python deps
        # pymupdf backs --check-fonts (it reads the text spans of a rendered PDF);
        # without it that step exits 2 on a missing dependency rather than judging
        # the fonts.
        run: python3 -m pip install weasyprint pypdf pymupdf Pygments python-pptx

      - name: Set up Node.js for strict mathematics
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/kami/scripts/mathjax-runtime/package-lock.json

      - name: Install locked MathJax runtime
        run: bash skills/kami/scripts/ensure_mathjax.sh

      - name: Install the skill the way users do
        # The skills CLI copies the directory that owns SKILL.md. This guards
        # the layout contract: a bare install must yield skills/kami alone,
        # never the website or the fonts that share the repository.
        run: |
          export HOME="$(mktemp -d)"
          npx --yes skills add "$GITHUB_WORKSPACE" -a claude-code codex cursor -g -y
          installed="$HOME/.agents/skills/kami"
          test -f "$installed/SKILL.md"
          test -f "$installed/scripts/build.py"
          test ! -e "$installed/index.html"
          test ! -e "$installed/site"
          test ! -e "$installed/assets/fonts/TsangerJinKai02-W04.ttf"
          size_kb="$(du -sk "$installed" | cut -f1)"
          test "$size_kb" -lt 6000
          echo "OK: bare install is skills/kami only (${size_kb} KB)"

      - name: Run full test suite with render dependencies
        run: python3 scripts/tests/test_build.py

      - name: Verify page counts, long-doc counters, and editable PPTX decks
        # Every HTML template with a non-zero registry ceiling runs here, so a
        # newly registered hard-page target joins CI automatically.
        # Long-docs have no page ceiling but must verify rendered TOC counters.
        # The job builds both editable PPTX fallbacks through their installed
        # runtime dependency instead of only checking their source strings.
        # KAMI_ALLOW_FALLBACK_ONLY=1: CI does not ship commercial fonts
        # (TsangerJinKai02, Charter). Treat fallback-only embedding as a
        # warning instead of a failure so CI can still gate page counts.
        env:
          KAMI_ALLOW_FALLBACK_ONLY: '1'
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, "skills/kami/scripts")
          from shared import HTML_TEMPLATES

          for name, spec in HTML_TEMPLATES.items():
              if spec.build_max_pages or name.startswith("long-doc"):
                  subprocess.run(
                      [sys.executable, "skills/kami/scripts/build.py", "--verify", name],
                      check=True,
                  )
          PY
          python3 skills/kami/scripts/build.py --verify slides
          python3 skills/kami/scripts/build.py --verify slides-en

      - name: Check which family actually drew the CJK text
        # Page counts cannot see the typeface. With fonts-noto-cjk installed
        # this reports a serif fallback and passes; it fails if the CJK body
        # ever lands on a sans or gets split across two families, which is how
        # a broken font install would otherwise ship looking merely "fine".
        run: python3 skills/kami/scripts/build.py --check-fonts assets/examples/one-pager.pdf assets/examples/one-pager-ko.pdf assets/examples/resume.pdf
